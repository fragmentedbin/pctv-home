<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; cursor: none; user-select: none; }
  body { display: flex; align-items: center; justify-content: flex-end; padding: 0 4px; box-sizing: border-box; }
  body.left { justify-content: flex-start; }
  /* like Windows' "Activate Windows": plain gray text, see-through, nothing behind it */
  #t { font: 400 20px/1.2 "Segoe UI", system-ui, -apple-system, sans-serif; color: #c8c8c8; white-space: nowrap;
       opacity: 0; transition: opacity .8s ease; }
  #t.on { opacity: .5; }
</style></head>
<body><span id="t"></span>
<script>
  const t = document.getElementById('t');
  t.textContent = new URLSearchParams(location.search).get('text') || '';
  window.fadeIn = left => { document.body.classList.toggle('left', !!left); t.classList.add('on'); };
  window.fadeOut = () => t.classList.remove('on');
</script>
</body></html>
