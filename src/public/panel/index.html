<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCTV Home</title>
<link rel="icon" href="/brand/favicon.ico">
<link rel="stylesheet" href="/panel/panel.css">
</head>
<body>
  <header>
    <img src="/brand/logo.svg" alt="" class="logo">
    <div>
      <h1>PCTV Home</h1>
      <p class="sub">Your PC, as a smart TV · <span id="version"></span></p>
    </div>
  </header>

  <section class="card pair">
    <img id="qr" alt="Pairing QR code">
    <div class="pair-text">
      <h2>Pair your phone</h2>
      <p>Scan with your phone camera, then tap <b>Add to Home Screen</b> to keep the remote like an app.</p>
      <code id="url"></code>
      <div class="row">
        <button id="copy" class="ghost small">Copy link</button>
        <button id="newKey" class="ghost small" title="Disconnects paired phones">New pairing code</button>
      </div>
      <p class="remotes" id="remotes"></p>
    </div>
  </section>

  <section class="actions">
    <button id="open" class="primary">Open TV Home</button>
    <button id="restart" class="ghost">Restart</button>
    <button id="incog" class="ghost" title="Private session: no logins or history are kept">Incognito</button>
  </section>

  <section class="card">
    <h3>Status</h3>
    <ul class="checks" id="checks"></ul>
  </section>

  <section class="card">
    <h3>Settings</h3>
    <label class="toggle"><input type="checkbox" id="autoUpdate"><span class="sw"></span><span><b>Update automatically</b><small>Downloads new versions in the background; it asks before restarting</small></span></label>
    <label class="toggle"><input type="checkbox" id="startAtLogin"><span class="sw"></span><span><b>Start with my computer</b><small>Runs quietly in the tray / menu bar</small></span></label>
    <label class="select"><span><b>Browser for streaming</b><small>Edge plays Netflix in up to 4K on Windows; Chrome is limited to 720p</small></span>
      <select id="browserPref"><option value="auto">Automatic</option><option value="chrome">Google Chrome</option><option value="edge">Microsoft Edge</option></select></label>
    <label class="select" id="displayRow" style="display:none"><span><b>Show TV Home on</b><small>Pick the TV or monitor; it's remembered</small></span>
      <select id="displayPick"></select></label>
    <label class="select"><span><b>TV size</b><small id="uiScaleHint">How big websites look on the TV. Auto adjusts when you plug in a monitor.</small></span>
      <select id="uiScale"><option value="auto">Auto</option><option value="system">Windows/macOS setting</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="1.75">175%</option><option value="2">200%</option><option value="2.5">250%</option><option value="3">300%</option></select></label>
    <label class="select"><span><b>YouTube on this screen</b><small>For screens that aren't 16:9, like 16:10 laptops</small></span>
      <select id="ytFill"><option value="auto">Fill (recommended)</option><option value="zoom">Zoom (crop edges)</option><option value="stretch">Stretch</option><option value="fit">Fit (black bars)</option></select></label>
    <label class="select"><span><b>Secure DNS</b><small>Opens sites your internet provider blocks by DNS. TV Home has its own browser settings, so set it here</small></span>
      <select id="secureDns"><option value="off">Off (use the PC's DNS)</option><option value="cloudflare">Cloudflare (1.1.1.1)</option><option value="google">Google (8.8.8.8)</option><option value="quad9">Quad9</option><option value="adguard">AdGuard (blocks ads)</option></select></label>
    <label class="toggle"><input type="checkbox" id="openOnStart"><span class="sw"></span><span><b>Open TV Home when it starts</b><small>Goes straight to the big-screen home</small></span></label>
  </section>

  <footer>
    <a href="#" data-url="https://github.com/fragmentedbin/pctv-home">GitHub</a> ·
    <a href="#" data-url="https://github.com/fragmentedbin/pctv-home/issues">Report a problem</a> ·
    <span>Free for personal use</span>
  </footer>
<script src="/panel/panel.js"></script>
</body>
</html>
